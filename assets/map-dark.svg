<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="t d">
<title id="t">Map of the work</title>
<desc id="d">5 lines of tools: Proteomics analysis (pepVet, pxseek, PXAudit, HarmonizePy, SQuAPP, QuEStVar, ProteoForge, ihwkit, loqculate, FusionPep); Mass spectrometry (zmz, mzValidate, mzDiff, mzArc, zpx); Sequence data (z-fastq, z-fasta, zamf); NGS tools (refz, starz, zeklem, zigot); Shared libraries (zipir, z-xml, b64z, z-oci, zebrac, z-toml, kanit). The Mass spectrometry, Sequence data, NGS tools lines branch from the shared libraries. Filled stations are public; hollow stations are in development.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif} .n{font-size:13px;font-weight:600;fill:#e6edf3} .r{font-size:11px;fill:#9198a1} .h{font-size:12px;font-weight:700;fill:#e6edf3;letter-spacing:.04em} .m{font-size:11px;fill:#6e7681}</style>
