<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="960" height="344" role="img" aria-labelledby="t d">
<title id="t">Correct, fast, and small, against named tools</title>
<desc id="d">z-fasta against samtools faidx 1.24 (index the human genome): same .fai bytes, 19 of 19 cases, 24.7x faster, 2.5x less memory; zmz against OpenMS 3.6.0 (decode mzML): 69 of 69 hard files; OpenMS 64, 4.4x faster, 213x less memory; zmz against mzdata 0.67.4 (decode mzML): 69 of 69 hard files; mzdata 36, 1.7x faster, 10.4x less memory; z-fastq against Needletail 0.7.3 (count FASTQ records): right on 218 of 218 inputs, 1.1x to 1.4x faster, 2.2x to 2.6x less memory; zipir against zlib-ng (zlib decompression): same output bytes, 1.3x faster, 2.7x to 2.9x less memory.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif} .n{font-size:14px;font-weight:600;fill:#e6edf3} .r{font-size:12px;fill:#9198a1} .h{font-size:15px;font-weight:600;fill:#e6edf3} .k{font-size:11px;fill:#6e7681} .v{font-size:12px;font-weight:600;fill:#e6edf3} .c{font-size:12px;fill:#e6edf3}</style>
<rect width="960" height="344" rx="6" fill="#0d1117"/>
